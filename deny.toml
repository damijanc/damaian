# cargo-deny configuration. Run locally with `cargo deny check`.
#
# Scoped to the one target Damaian actually ships (Apple Silicon macOS). Without
# this, the dependency graph includes the GTK/X11 and Windows halves of Tauri
# that are never compiled for a macOS build, which produces a long list of
# advisories and licenses that cannot be acted on.
[graph]
targets = [{ triple = "aarch64-apple-darwin" }]
all-features = true

[advisories]
version = 2
# Only flag unmaintained crates this workspace depends on directly. Unmaintained
# transitive dependencies of Tauri are upstream's to replace, not ours, and
# failing CI on them would just teach contributors to ignore the gate.
unmaintained = "workspace"
ignore = [
  # bincode 1.3.3: the maintainers stopped development and consider 1.3.3
  # complete; there is no vulnerability and no upgrade path. Reached directly
  # (vector_index.rs) and via syntect. Revisit if the local vector-index cache
  # format is ever changed.
  { id = "RUSTSEC-2025-0141", reason = "bincode is feature-complete and unmaintained by choice; no vulnerability" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
# Duplicate versions are common and largely unavoidable in the Tauri tree.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
