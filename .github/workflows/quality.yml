name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  # Called by the release workflow so a tagged build runs exactly these checks.
  # Quality is defined here and only here.
  workflow_call:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that does not need to compile the Rust workspace. Runs on Linux
  # so it stays fast and cheap, and fails before the macOS job burns minutes.
  checks:
    name: Formatting, lint config, dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check desktop JavaScript syntax
        run: node --check crates/desktop-shell/static/app.js

      - name: Lint web assets
        run: npm run lint:web

      # Advisory: reports a spec marked Done while another still calls it
      # **not built**, which is what makes docs/specs/README.md's "What to build
      # next" wrong. It exits 0 and annotates, so it never fails this job — a
      # documentation inconsistency should not stop a build. `--strict` is the
      # switch if that changes.
      - name: Check spec dependency status (advisory)
        run: npm run specs:check

      - name: Check for typos
        uses: crate-ci/typos@v1.49.0

      - name: Check dependency advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  # Needs macOS: the desktop-app crate is a Tauri wrapper that only builds
  # against the macOS system webview.
  rust:
    name: Clippy and tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-quality-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-

      # The action pin fixes the nextest version too: each release carries the
      # manifest it installs from, so this resolves the same way every run.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.13
        with:
          tool: cargo-nextest

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--final-status-level slow` prints the tests nextest considered slow, so
      # a suite drifting back towards forty-five minutes shows up in the log
      # rather than only in the job duration.
      - name: Run tests
        run: cargo nextest run --workspace --locked --final-status-level slow
