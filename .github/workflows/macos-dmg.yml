name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version for manual builds, for example 0.1.3"
        required: true
        type: string
      channel:
        description: "Release channel. Stable requires Apple signing credentials."
        required: false
        default: preview
        type: choice
        options:
          - preview
          - stable
  push:
    tags:
      - "v*"

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No build goes out on a red tree. This calls the same workflow that gates
  # pull requests, so a tag or a manual build cannot ship past a check that a
  # pull request would have failed on.
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  build:
    name: Build Apple Silicon DMG
    needs: quality
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Stamp release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [[ -z "${version}" && "${REF_TYPE}" == "tag" ]]; then
            version="${REF_NAME#v}"
          fi
          if [[ -n "${version}" ]]; then
            npm run version:sync -- "${version}"
            echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
            echo "RELEASE_TAG=v${version}" >> "${GITHUB_ENV}"
          else
            echo "No release version provided; using repository metadata version."
            echo "RELEASE_VERSION=" >> "${GITHUB_ENV}"
            echo "RELEASE_TAG=" >> "${GITHUB_ENV}"
          fi
          # Channel follows the trigger, not a repository setting: a tag is
          # always a stable release, everything else defaults to preview.
          if [[ "${REF_TYPE}" == "tag" ]]; then
            channel="stable"
          else
            channel="${INPUT_CHANNEL:-preview}"
          fi
          if [[ "${channel}" != "stable" && "${channel}" != "preview" ]]; then
            echo "Unknown release channel: ${channel}"
            exit 1
          fi
          echo "RELEASE_CHANNEL=${channel}" >> "${GITHUB_ENV}"
          echo "Building the ${channel} channel."

      # Tauri skips signing and notarization silently when credentials are
      # absent, so a stable build asserts its inputs before it starts rather
      # than discovering the problem at verification time, or not at all.
      # Presence only: no value or length is ever printed.
      - name: Check release credentials
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_CONTENT \
            TAURI_UPDATER_PUBKEY \
            TAURI_UPDATER_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secret: %s\n' "${missing[@]}"
            echo "A stable release cannot proceed without every signing credential."
            exit 1
          fi
          echo "All required release credentials are present."

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Refresh Cargo lock for stamped version
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_VERSION}" ]]; then
            cargo update --workspace
          else
            echo "No release version stamped; lockfile refresh not needed."
          fi

      - name: Configure updater release artifacts
        if: env.RELEASE_VERSION != ''
        env:
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_UPDATER_PUBKEY}" || -z "${TAURI_UPDATER_PRIVATE_KEY}" ]]; then
            if [[ "${RELEASE_CHANNEL}" == "stable" ]]; then
              echo "Missing updater signing secrets for a stable release."
              exit 1
            fi
            # A fork or contributor with no secrets must still get a preview
            # DMG, so the updater artifacts are dropped rather than the build.
            echo "No updater secrets; this preview build produces no updater artifacts."
            echo "UPDATER_ARTIFACTS=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          npm run updater:enable-artifacts
          echo "UPDATER_ARTIFACTS=true" >> "${GITHUB_ENV}"

      - name: Install Tauri CLI
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version 2.11.4 --locked
          fi

      # Written to the runner temp directory, never into the workspace, so it
      # cannot be picked up by a later glob and uploaded.
      - name: Write App Store Connect API key
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/apple-api-key.p8"
          printf '%s' "${APPLE_API_KEY_CONTENT}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          if [[ ! -s "${key_path}" ]]; then
            echo "APPLE_API_KEY_CONTENT did not decode to a key file."
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      # Tauri creates and destroys its own temporary keychain for
      # APPLE_CERTIFICATE, so there is no hand-rolled keychain flow here.
      - name: Build signed DMG
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          DAMAIAN_RELEASE_CHANNEL: stable
        run: npm run desktop:build

      - name: Build preview DMG
        if: env.RELEASE_CHANNEL != 'stable'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          DAMAIAN_RELEASE_CHANNEL: preview
        run: npm run desktop:build:preview

      # Tauri notarizes and staples the .app, but builds the DMG afterwards and
      # leaves it unstapled. An unstapled DMG shows a Gatekeeper dialog on a
      # machine that is offline or behind a network blocking Apple's OCSP
      # responder, so the DMG is submitted separately here.
      - name: Notarize and staple DMG
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          dmg="$(find target/release/bundle/dmg -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "No DMG was produced."
            exit 1
          fi

          set +e
          result="$(xcrun notarytool submit "${dmg}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --output-format json \
            --wait)"
          submit_status=$?
          set -e

          echo "${result}"
          submission_id="$(printf '%s' "${result}" | jq -r '.id // empty')"
          notarization_status="$(printf '%s' "${result}" | jq -r '.status // empty')"

          if [[ ${submit_status} -ne 0 || "${notarization_status}" != "Accepted" ]]; then
            echo "Notarization failed with status: ${notarization_status:-unknown}"
            if [[ -n "${submission_id}" ]]; then
              # The log names the offending binary and contains no secrets, so
              # the failure is diagnosable without re-running.
              xcrun notarytool log "${submission_id}" \
                --key "${APPLE_API_KEY_PATH}" \
                --key-id "${APPLE_API_KEY}" \
                --issuer "${APPLE_API_ISSUER}" || true
            fi
            exit 1
          fi

          xcrun stapler staple "${dmg}"

      - name: Verify macOS bundle
        env:
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/Damaian.app
          dmg="$(find target/release/bundle/dmg -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "No DMG was produced."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "${app}"
          hdiutil verify "${dmg}"

          if [[ "${RELEASE_CHANNEL}" != "stable" ]]; then
            echo "Preview build: ad-hoc signed artifact, not distributable to other Macs."
            exit 0
          fi

          # Captured rather than piped: grep -q would close the pipe early and
          # make codesign die of SIGPIPE, which pipefail reports as a failure.
          signature="$(codesign -dvvv "${app}" 2>&1)"

          # The one condition an ad-hoc signature cannot satisfy, and exactly
          # the failure mode that shipped every previous artifact.
          grep -q '^Authority=Developer ID Application' <<<"${signature}"
          # Notarization requires the hardened runtime; assert it was enabled.
          grep -q 'flags=.*runtime' <<<"${signature}"

          xcrun stapler validate "${app}"
          xcrun stapler validate "${dmg}"

          spctl --assess --type execute --verbose=4 "${app}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg}"

          echo "Developer ID signed, notarized and stapled."

      - name: Create updater manifest
        if: env.UPDATER_ARTIFACTS == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: npm run updater:manifest

      - name: Verify updater signature
        if: env.UPDATER_ARTIFACTS == 'true'
        env:
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: npm run updater:verify-signature

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "${RUNNER_TEMP}/apple-api-key.p8"

      - name: Show bundle output
        run: |
          find target/release/bundle -maxdepth 3 -type f -print

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Damaian-macOS-arm64-${{ env.RELEASE_CHANNEL }}-DMG
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/updater/latest.json
            target/release/bundle/updater/preview.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag build is always the stable channel, so only stable artifacts and
      # latest.json can ever reach a GitHub Release.
      - name: Download DMG artifacts
        uses: actions/download-artifact@v8
        with:
          name: Damaian-macOS-arm64-stable-DMG
          path: release-artifacts

      - name: Build release notes from commit history
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          if [[ -n "${prev_tag}" ]]; then
            range="${prev_tag}..${TAG_NAME}"
            echo "Generating notes for range ${range}"
          else
            range="${TAG_NAME}"
            echo "No previous tag found; using all commits up to ${TAG_NAME}"
          fi
          changelog="$(git log "${range}" --no-merges --pretty=format:'- %s (%h)')"
          {
            if [[ -n "${prev_tag}" ]]; then
              echo "## What's Changed since ${prev_tag}"
            else
              echo "## What's Changed"
            fi
            echo ""
            if [[ -n "${changelog}" ]]; then
              echo "${changelog}"
            else
              echo "- No changes recorded."
            fi
          } > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" -o \
            -name "latest.json" \
          \) -print)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found."
            exit 1
          fi
          if gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --repo "${GH_REPO}" --clobber
            gh release edit "${TAG_NAME}" --repo "${GH_REPO}" --notes-file release-notes.md
          else
            gh release create "${TAG_NAME}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --title "${TAG_NAME}" \
              --notes-file release-notes.md
          fi
