name = "bounded_worker_without_budget_pauses"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Implement retry handling across the crate, one bounded step at a time."
# The review was produced by an inline session, so it offers no budget. The
# worker record is written afterwards, which is the state a historical worker
# without an approved task budget resumes from (requirement 4).
worker_record_after_plan_review = true
plan_decision = "approve"

# Spec 103 acceptance 2: the same script as `bounded_worker_three_segments`
# without an approved task budget keeps the existing explicit round pause. The
# ordinary segment limit is the same four action rounds, so it pauses at the
# exact boundary the budgeted worker crosses internally, and no segment event is
# written.
config_overlay = """
agent_max_tool_rounds=4
agent_max_exploration_rounds=24
"""

# This is the same script as `bounded_worker_three_segments`, including the
# `complete_step` beside each read. The plan has only two steps, so the later
# calls fail with "No step is in progress" by design; they stay because a round
# is charged to the action budget unless every decoded call is a read or notes
# call. See the budgeted scenario for the full explanation.

[[turn]]
content = ""
tool_calls = [
  { name = "propose_plan", arguments = { steps = [ { title = "Read the upload client" }, { title = "Add retry handling" } ] } },
]

# This run_command is the deferred mutating action that raises the plan-review
# gate. The gate drops it without dispatching, so it is never approved or run;
# the resumed turn asks the model again and starts with the first read below.
[[turn]]
content = ""
tool_calls = [
  { name = "run_command", arguments = { command = "sed -i '' 's/1/2/' src/upload.rs", reason = "Bump the upload constant." } },
]

[[turn]]
content = ""
tool_calls = [
