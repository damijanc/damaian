name = "navigated_edit"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Find the upload client and give it a retry"

# Spec 47's first slice, reaching `one_file_patch`'s outcome through the tool
# surface that slice added. The two scenarios are deliberately the same task:
# `one_file_patch` is handed the path and answers with whole-file content, this
# one finds the path by navigating and answers with an anchored region. What
# fails here and nowhere else is the tool surface disappearing — before this
# scenario, `list_directory`, `search_content`, a ranged `read_file` and
# `edit_file` could all stop being offered and every eval would still pass.
#
# `read_file` takes a range that skips the doc comment, so the ranged read is
# exercised rather than assumed: an unranged read of a seven-line file would
# return the same bytes and prove nothing.
#
# **What this scenario cannot measure.** Two things, both by construction:
#
# - *Fewer rounds.* The deterministic tier scripts every call, so the round
#   count here is the script's, not the model's. Whether the surface actually
#   saves rounds is a live-tier question, and this scenario is not evidence for
#   it.
# - *Redaction and path policy inside a tool result.* A `search_content` over
#   `secrets/` would be the obvious assertion, but `absent_everywhere` reads the
#   response, the context files, the run record and the audit trace — and a tool
#   result reaches none of those. The assertion would pass whatever the tool
#   returned, which is worse than not asserting it. The engine's own tests cover
#   that (the redaction one is mutation-tested); widening the harness to see
#   tool results is its own change.
[[turn]]
content = ""
tool_calls = [
  { name = "list_directory", arguments = { dir = "src" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "search_content", arguments = { pattern = "payload was empty" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs", start_line = 2, end_line = 7 } },
]

# The anchor appears exactly once in the file. That is the requirement-4 rule
# this call depends on: were it to match twice, the edit would be refused and
# `patch_touches` would fail rather than silently splicing the wrong region.
[[turn]]
content = "I added a retry loop next to the existing upload."
tool_calls = [
  { name = "edit_file", arguments = { summary = "Retry uploads", edits = [
    { path = "src/upload.rs", old_text = """
    Ok(())
}""", new_text = """
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let mut last = Err("no attempt was made".to_string());
    for _ in 0..attempts.max(1) {
        last = upload(payload);
        if last.is_ok() {
            return last;
        }
    }
    last
}""" },
  ] } },
]

[assert]
# Identical to `one_file_patch`'s assertions on purpose: requirement 4 says a
# region edit is indistinguishable downstream from a whole-file proposal, so the
# two scenarios asserting the same four things is the claim, not duplication.
patch_touches = ["src/upload.rs"]
approval_required = true
patch_applied = false
# Both of the above depend on the model choosing to propose an edit at all,
# which the script decides here and the model decides in the live tier — where
# it read the file and answered in prose instead, failing two assertions that
# were never about the live tier. §5.3's mechanism, used as intended.
deterministic_only = ["patch_touches", "approval_required"]
# Navigating reads only. A changed file here would mean one of the three read
# tools wrote something.
files_changed_outside_patch = 0
