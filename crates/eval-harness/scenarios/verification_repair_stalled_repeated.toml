name = "verification_repair_stalled_repeated"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Add a retry to the upload client"

# Specification 102 requirement 7 and acceptance criterion 4: two consecutive
# repairs leave the same failure fingerprint, so automatic repair stops before
# the configured limit of sixteen. The first repair changes the file without
# changing the compiler error; the second proposal is never applied.
verify_after_apply = true
check_decisions = [{ command = "cargo test", approved = true }]
config_overlay = """
agent_tool_retry_limit=16
"""

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs" } },
]

[[turn]]
content = "I added a retry helper."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Add upload retry", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let _value: i32 = "not a number";
    Ok(())
}
""" },
  ] } },
]

[[turn]]
content = "I changed the nearby code but not the error."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Adjust the retry helper", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let _value: i32 = "not a number";
    Ok(())
}

// attempt two
""" },
  ] } },
]

[[turn]]
content = "I tried a different repair."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Try another fix", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let _value: bool = 42;
    Ok(())
}
""" },
  ] } },
]

[assert]
verification_outcome = "repair_stalled"
verification_baselines = [{ command = "cargo test", state = "passed" }]
verification_provenances = [{ command = "cargo test", provenance = "new_regression" }]
verification_repair_targets = 0
verification_action_kinds = ["review_stalled_repair"]
repair_stall_reason = "repeated_failure"
# Read, initial patch, first repair, and the stalled second repair. Exhausting
# the limit of sixteen would need many more model calls.
model_calls_at_most = 4
final_task_status = "failed"
