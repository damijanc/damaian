name = "long_discovery"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Survey this crate before answering: read its source files, list src, and find its public functions. Then say what the crate does."

# Spec 59 §5.7's long-discovery scenario, and the long-task case #47 §7.2 said
# was missing. Fourteen read-only rounds — every call new, so none is a repeat
# (§5.3) — are charged to the exploration allowance rather than the eight-round
# action budget. The turn must therefore reach the answer.
#
# Each call is distinct: twelve different files, then a listing and a search.
# Two rounds that read the same path with the same arguments would make the
# second an action round, which is exactly what `read_loop` measures.
# Pinned to the old default: the scenario counts rounds against this
# budget, and the product default (16) is not what it tests.
config_overlay = """
agent_max_tool_rounds=8
"""

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/checkout.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/config_parse.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/http_client.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/inventory.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/lib.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/logging.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/string_utils.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/telemetry.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/telemetry_config.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/AGENTS.md" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "Cargo.toml" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "list_directory", arguments = { dir = "src" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "search_content", arguments = { pattern = "pub fn" } },
]

[[turn]]
content = "The crate is a small Rust workspace. It has an upload client that rejects an empty payload and has no retry, a checkout discount helper, and supporting modules for HTTP, inventory, logging, telemetry, configuration parsing and string handling."

[assert]
final_task_status = "complete"
# Fourteen all-read rounds, then the answer. The action budget of eight is
# never reached, so nothing pauses and no continuation is granted.
exploration_rounds = 14
tool_rounds_at_most = 14
tool_calls_at_least = 14
model_calls_at_most = 15
deterministic_only = [
  "final_task_status",
  "exploration_rounds",
  "tool_rounds_at_most",
  "tool_calls_at_least",
  "model_calls_at_most",
]
