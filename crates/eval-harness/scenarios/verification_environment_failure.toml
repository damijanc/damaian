name = "verification_environment_failure"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Add a retry to the upload client"

# Specification 102 requirement 5 and acceptance criterion 3: a check that
# cannot start is an environment failure with a user action, never a code-repair
# target. The configured shell does not exist, so the process spawn itself fails
# before a check result exists.
verify_after_apply = true
check_decisions = [{ command = "cargo test", approved = true }]
config_overlay = """
shell=/definitely/missing-damaian-eval-shell
"""

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs" } },
]

[[turn]]
content = "I added a retry helper."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Add upload retry", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let mut last = Err("no attempt was made".to_string());
    for _ in 0..attempts.max(1) {
        last = upload(payload);
        if last.is_ok() {
            return last;
        }
    }
    last
}
""" },
  ] } },
]

[assert]
verification_outcome = "failed"
verification_baselines = [{ command = "cargo test", state = "unavailable" }]
verification_provenances = [{ command = "cargo test", provenance = "environment_failure" }]
verification_repair_targets = 0
verification_action_kinds = ["fix_environment"]
repair_stall_reason = "none"
model_calls_at_most = 2
final_task_status = "failed"
