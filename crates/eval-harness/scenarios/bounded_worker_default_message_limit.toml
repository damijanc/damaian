name = "bounded_worker_default_message_limit"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Read the upload notes at the product message limit, then reread the one you compacted."
worker_record = true
plan_decision = "approve_budget"
context_window = 60000

# R7: the same long read history as `bounded_worker_long_read_reread`, but
# deliberately at the product default `agent_max_turn_messages` (24). Once the
# script passes eleven tool rounds the legacy count cut applies; pinned messages
# (the approved plan and budget, the latest result for the open step) must
# survive it alongside compaction.
#
# `pinned_state_unchanged` is deliberately not asserted: the harness oracle
# compares consecutive requests and assumes the only change is compaction. The
# count cut legitimately drops older *unpinned* rounds between them. The
# byte-identical pin check lives in
# `tests/within_turn_request_preparation.rs`'s R7 regressions instead.
config_overlay = """
agent_max_tool_rounds=8
agent_max_exploration_rounds=24
worker_task_budget_action_rounds=8
worker_task_budget_exploration_rounds=24
"""

[[seed_files]]
path = "data/blob0.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob1.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob2.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob3.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob4.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob5.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob6.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob7.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"

[[turn]]
content = ""
tool_calls = [
  { name = "propose_plan", arguments = { steps = [ { title = "Read the upload notes" }, { title = "Summarise the notes" } ] } },
]

# The plan-review gate pauses before a mutating action. This turn is deferred and
# dropped by the review, so the resume asks the model again and the next scripted
# turn is the first read.
[[turn]]
content = ""
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Prepare the change", files = [ { path = "never.txt", content = "never\n" } ] } },
]

[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob0.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob1.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob2.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob3.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob4.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob5.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob6.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob7.txt" } } ]

[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob0.txt" } } ]

[[turn]]
content = ""
tool_calls = [ { name = "complete_step", arguments = {} } ]

[[turn]]
content = ""
tool_calls = [ { name = "complete_step", arguments = {} } ]

[[turn]]
content = "The notes describe an upload client that rejects an empty payload."

[assert]
continuations = 0
task_count = 1
final_task_status = "complete"
reread_after_compaction = true
deterministic_only = [
  "continuations",
  "task_count",
  "final_task_status",
  "reread_after_compaction",
]
