name = "read_loop"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Read src/upload.rs and summarise it."
round_budget_decision = "answer_now"

# Spec 59 §5.7's second scenario: the model reads the same file with the same
# range every round. Round one is new, so it is an exploration round; every
# round after it is a repeat (§5.3) and therefore an action round. The turn
# stops after one exploration round plus the eight-round action budget — nine
# dispatched rounds, not the thirty-two the allowance alone would permit.
#
# With no token ceiling the engine pauses at the action budget (spec 61), so the
# scenario answers *Answer now*. The tenth scripted response is consumed by the
# forced final call, which offers no tools; the script still asks for one, which
# is what ends the turn `ToolBudgetExhausted` (C10).
#
# The range is explicit so "the same read" is unambiguous: a continued window
# after a truncated read is not a repeat, and this scenario is not that.
[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs", start_line = 1, end_line = 7 } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs", start_line = 1, end_line = 7 } },
]

