name = "answer_now_ends_the_turn"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "List the source files, then describe what the upload client does."
round_budget_decision = "answer_now"

# Spec 61 §5.8's second case: the same pause, answered with *Answer now*. The
# forced final call drops tools; the scripted response still asks for one, so
# the turn ends `ToolBudgetExhausted` — the terminal outcome this case asserts.
#
# The eight rounds are command rounds for the reason `continue_keeps_state.toml`
# records: a command is an action round under spec 59 too, so the script reaches
# the round budget before and after that spec.
# Pinned to the old default: the scenario counts rounds against this
# budget, and the product default (16) is not what it tests.
config_overlay = """
agent_max_tool_rounds=8
"""

[[turn]]
content = ""
tool_calls = [
  { name = "run_command", arguments = { command = "ls src", reason = "List the source files" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "run_command", arguments = { command = "ls src", reason = "List the source files" } },
]

[[turn]]
content = ""
tool_calls = [
  { name = "run_command", arguments = { command = "ls src", reason = "List the source files" } },
]

