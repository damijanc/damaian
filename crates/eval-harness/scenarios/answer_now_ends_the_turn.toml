tool_calls = [
  { name = "run_command", arguments = { command = "ls src", reason = "List the source files" } },
]

# The ninth response, consumed only by the Answer-now forced call. It asks for a
# tool even though the forced call offered none, which is what ends the turn.
[[turn]]
content = ""
tool_calls = [
  { name = "run_command", arguments = { command = "ls src", reason = "List the source files" } },
]

[assert]
# Answer now is not a continuation: no `turn_budget_extended` is recorded.
continuations = 0
task_count = 1
final_task_status = "tool_budget_exhausted"

# Eight rounds plus exactly one forced final call. A second call on resume, or
# a call made before the choice, would exceed nine.
model_calls_at_most = 9
# The forced call dispatches nothing: the eight command rounds are the whole
# side-effect set.
tool_calls_at_least = 8
deterministic_only = [
  "continuations",
  "task_count",
  "final_task_status",
  "model_calls_at_most",
  "tool_calls_at_least",
]
