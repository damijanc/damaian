name = "resume_interrupted_session"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Add a retry to the upload client"

# A session interrupted while a command was running must classify what it left
# behind and never repeat it. Unblocked by spec 17; see §5.4 and §5.6.
#
# Why the crash is declared rather than performed: killing a real process here
# would make the whole deterministic tier depend on process control and timing.
# The runner instead writes the *signature* a kill leaves — the task in
# `running_tool` with an `action_started` and no `action_finished` — then
# reopens the store, which is what a restart does. That the signature is what a
# real kill actually leaves is proven separately by spec 17's `#[ignore]`d
# `a_real_sigkill_mid_action_leaves_a_readable_log_and_an_unknown_outcome`.
#
# The two assertions that carry this row are `recovered_classification` and
# `auto_retry_refused`. `command_executed` and `files_changed_outside_patch`
# corroborate them but cannot stand alone: `run_command` needs approval, so
# both would read as expected even if recovery did nothing at all. That is the
# weak version this scenario's original comment rejected, and it is still the
# trap — do not let those two be the only checks here.

[[turn]]
content = ""
tool_calls = [
  { name = "run_command", arguments = { command = "cargo test", reason = "Run the suite" } },
]

# The command the turn stopped on, left in flight. `side_effecting = true` is
# the load-bearing field: it is what makes the outcome unknowable, and so the
# retry unsafe.
[crash_mid_action]
action = "run_command"
reference = "cargo test"
side_effecting = true

[assert]
recovered_classification = "unknown_external_outcome"
auto_retry_refused = true
command_executed = false
files_changed_outside_patch = 0
