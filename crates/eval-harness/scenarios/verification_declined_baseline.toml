name = "verification_declined_baseline"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Add a retry to the upload client"

# Specification 102 requirement 6 and acceptance criterion 6: declining the
# baseline does not decline the patch, and a later failure is `unknown_provenance`
# rather than assumed to be caused by the task. The check itself is approved
# after the patch, so the run really does produce a failure.
verify_after_apply = true
check_decisions = [{ command = "cargo test", approved = true }]
decline_baseline = true

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs" } },
]

[[turn]]
content = "I added a retry helper."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Add upload retry", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let _value: i32 = "not a number";
    Ok(())
}
""" },
  ] } },
]

[assert]
verification_outcome = "failed"
verification_baselines = [{ command = "cargo test", state = "declined" }]
verification_provenances = [{ command = "cargo test", provenance = "unknown_provenance" }]
verification_repair_targets = 0
verification_action_kinds = ["provide_baseline"]
repair_stall_reason = "none"
model_calls_at_most = 2
final_task_status = "failed"
