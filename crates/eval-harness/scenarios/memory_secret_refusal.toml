name = "memory_secret_refusal"
fixture = "memory-injection"
tier = "deterministic"
prompt = "What did the build log say?"

# A seeded fake AWS key. The proposal-stage scan refuses it, so it reaches no
# card, no proposal, no entry and no audit field.
[[turn]]
content = ""
tool_calls = [
  { name = "propose_memory", arguments = { statement = "The deploy key AKIAIOSFODNN7EXAMPLE is set on the runner.", category = "environment" } },
]

[[turn]]
content = "I did not store the credential."

[assert]
memory_proposals = 0
memory_entries = 0
memory_absent = ["AKIAIOSFODNN7EXAMPLE", "The deploy key"]
memory_audit_contains = ["memory_proposal_refused", "secret"]
deterministic_only = ["memory_proposals", "memory_entries", "memory_absent", "memory_audit_contains"]
