name = "verification_pre_existing_failure"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Add a retry to the upload client"

# Specification 102 requirement 4 and acceptance criterion 1: a check that fails
# identically before and after the patch is `pre_existing`, and no repair turn
# starts. The failing integration test is seeded before the turn, so the
# pre-apply baseline sees exactly the failure the post-patch check sees. The
# patch itself compiles and touches a different file.
verify_after_apply = true
check_decisions = [{ command = "cargo test", approved = true }]
seed_files = [
  { path = "tests/pre_existing_failure.rs", content = """
#[test]
fn a_failure_that_predates_the_task() {
    assert_eq!(1 + 1, 3);
}
""" },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs" } },
]

[[turn]]
content = "I added a retry helper."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Add upload retry", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let mut last = Err("no attempt was made".to_string());
    for _ in 0..attempts.max(1) {
        last = upload(payload);
        if last.is_ok() {
            return last;
        }
    }
    last
}
""" },
  ] } },
]

[assert]
verification_outcome = "failed"
verification_baselines = [{ command = "cargo test", state = "failed" }]
verification_provenances = [{ command = "cargo test", provenance = "pre_existing" }]
verification_repair_targets = 0
verification_action_kinds = ["review_pre_existing_failure"]
repair_stall_reason = "none"
# Two model calls are the read and the patch. A repair turn would need another.
model_calls_at_most = 2
final_task_status = "failed"
