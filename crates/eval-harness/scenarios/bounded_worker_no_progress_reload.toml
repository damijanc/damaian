name = "bounded_worker_no_progress_reload"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Read the same four files until the task stops."
worker_record = true
plan_decision = "approve_budget"
reload_outcome = true

# Spec 103 acceptance 6 and requirement 10: the second and third cycles repeat
# the same typed calls with no new plan state, so the engine-owned digest does
# not advance and the task settles no_progress rather than reporting complete.
# A fresh engine reads the same outcome after the run.
config_overlay = """
agent_max_tool_rounds=2
agent_max_exploration_rounds=1
worker_task_budget_action_rounds=24
worker_task_budget_exploration_rounds=24
"""

