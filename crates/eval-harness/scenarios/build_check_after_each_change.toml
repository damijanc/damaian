name = "build_check_after_each_change"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Add a retry to the upload client, fixing any build errors along the way"

# Specification 109 requirement 9 and acceptance: after every applied change
# the fast build check (the Cargo fast path, since this fixture's plan carries
# no build check of its own) runs before anything else. The first patch builds
# and its check passes; the second patch breaks the build (a reference to a
# constant it forgot to define), so the verification ends `build_failed` with
# no other check run and no baseline, and the compiler's error reaches the
# model in the same turn; the third patch defines the constant, the build
# passes again, and the check passes.
verify_after_apply = true
check_decisions = [
  { command = "cargo test", approved = true },
  { command = "cargo check --tests", approved = true },
]

[[turn]]
content = ""
tool_calls = [
  { name = "read_file", arguments = { path = "src/upload.rs" } },
]

[[turn]]
content = "I added a retry helper."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Add upload retry", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let mut last = Err("no attempt was made".to_string());
    for _ in 0..attempts.max(1) {
        last = upload(payload);
        if last.is_ok() {
            return last;
        }
    }
    last
}
""" },
  ] } },
]

# This patch applies, but it does not build: `MAX_ATTEMPTS` is never defined.
[[turn]]
content = "I bounded the retry count."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Bound the retry count", files = [
    { path = "src/upload.rs", status = "modified", content = """
pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let mut last = Err("no attempt was made".to_string());
    for _ in 0..attempts.max(MAX_ATTEMPTS) {
        last = upload(payload);
        if last.is_ok() {
            return last;
        }
    }
    last
}
""" },
  ] } },
]

[[turn]]
content = "The build failed because the constant was never defined; here is the fix."
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Define the retry bound", files = [
    { path = "src/upload.rs", status = "modified", content = """
const MAX_ATTEMPTS: u32 = 3;

pub fn upload(payload: &str) -> Result<(), String> {
    if payload.is_empty() {
        return Err("payload was empty".to_string());
    }
    Ok(())
}

pub fn upload_with_retry(payload: &str, attempts: u32) -> Result<(), String> {
    let mut last = Err("no attempt was made".to_string());
    for _ in 0..attempts.max(MAX_ATTEMPTS) {
        last = upload(payload);
        if last.is_ok() {
            return last;
        }
    }
    last
}
""" },
  ] } },
]

# Spec 107 D3: once the repaired build verifies and its check passes, the
# planless task continues, and the model answers that the work is done.
[[turn]]
content = "The retry helper is in, the build was fixed, and the check passes."

[assert]
verification_outcome = "passed"
verification_passed_commands = ["cargo test"]
final_task_status = "complete"
patch_touches = ["src/upload.rs"]
files_changed_outside_patch = 0
# No check ever failed: the build failure never reached a check, so no
# baseline was ever taken for one (spec 109 D10: a build takes no baseline).
verification_baselines = []
build_failure_request_contains = [
  "Your change does not build",
  "cannot find value `MAX_ATTEMPTS`",
]
deterministic_only = [
  "build_failure_request_contains",
]
