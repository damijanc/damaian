name = "bounded_worker_long_read_reread"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Read the upload notes, then reread the one you compacted."
worker_record = true
plan_decision = "approve_budget"
context_window = 60000

# Spec 103 acceptance 4 and requirement 7: a planned, budgeted worker's long
# read history compacts before it crosses the configured request-window share,
# and the model may reread a compacted path through the ordinary tool. The files
# are generated by repeating one paragraph, so the scenario stays readable while
# the request does not.
# The legacy message-count cut is raised above this script's message count, so
# the only difference between the request before and after is compaction. A
# reduced `agent_max_turn_messages` would elide unpinned rounds first, which is a
# different mechanism and would hide whether compaction preserved the prefix.
# `bounded_worker_default_message_limit` is the same script at the product
# default, where that count cut is the point.
config_overlay = """
agent_max_tool_rounds=8
agent_max_exploration_rounds=24
agent_max_turn_messages=200
worker_task_budget_action_rounds=8
worker_task_budget_exploration_rounds=24
"""

[[seed_files]]
path = "data/blob0.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob1.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob2.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob3.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob4.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob5.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob6.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"
[[seed_files]]
path = "data/blob7.txt"
repeat = 500
content = "The upload client rejects an empty payload and reports the error to its caller.\n"

[[turn]]
content = ""
tool_calls = [
  { name = "propose_plan", arguments = { steps = [ { title = "Read the upload notes" }, { title = "Summarise the notes" } ] } },
]

# The plan-review gate pauses before a mutating action. This turn is deferred and
# dropped by the review, so the resume asks the model again and the next scripted
# turn is the first read.
[[turn]]
content = ""
tool_calls = [
  { name = "propose_patch", arguments = { summary = "Prepare the change", files = [ { path = "never.txt", content = "never\n" } ] } },
]

[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob0.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob1.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob2.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob3.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob4.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob5.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob6.txt" } } ]
[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob7.txt" } } ]

[[turn]]
content = ""
tool_calls = [ { name = "read_file", arguments = { path = "data/blob0.txt" } } ]

[[turn]]
content = ""
tool_calls = [ { name = "complete_step", arguments = {} } ]

[[turn]]
content = ""
tool_calls = [ { name = "complete_step", arguments = {} } ]

[[turn]]
content = "The notes describe an upload client that rejects an empty payload."

[assert]
continuations = 0
task_count = 1
final_task_status = "complete"
within_turn_compactions = 10
pinned_state_unchanged = true
reread_after_compaction = true
deterministic_only = [
  "continuations",
  "task_count",
  "final_task_status",
  "within_turn_compactions",
  "pinned_state_unchanged",
  "reread_after_compaction",
]
