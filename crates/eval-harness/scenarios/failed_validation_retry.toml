name = "failed_validation_retry"
fixture = "rust-workspace"
tier = "deterministic"
prompt = "Check whether the no-such-directory folder lists cleanly, and keep trying"

# The bound is the whole point, so this scenario is built to hit it.
#
# `ls no-such-directory` is classified Low risk with `requires_approval = false`
# (command_policy.rs:293), so it executes automatically — no approval stop to
# end the turn — and it exits non-zero every time. There is exactly ONE scripted
# turn, and `MockModelAdapter` repeats its last response once the sequence is
# exhausted, so the model asks for the same failing command forever.
#
# Nothing but the engine's own round limit can stop this. If
# `agent_max_tool_rounds` were not enforced the run would never terminate and
# this scenario would hang rather than fail — which is the correct way for a
# missing bound to announce itself.
#
# An approval-gated failing command (`false`, say) would NOT test this: the turn
# would stop at the proposal after one round and the assertion would pass
# without the loop ever running.
#
# Pinned to the old default of 8 so the loop stays short; the bound is what is
# tested, not the product default (16).
config_overlay = """
agent_max_tool_rounds=8
"""

[[turn]]
content = ""
tool_calls = [
  { name = "run_command", arguments = { command = "ls no-such-directory", reason = "List the folder" } },
]

[assert]
# 9: `agent_max_tool_rounds` is pinned to 8 above and bounds the *tool rounds*.
# Before spec 61 the engine then made one closing call, so a bounded run made
# 8 + 1 = 9 calls (measured: the first version asserted 8 and observed 9). Since
# spec 61 the turn pauses before that call and the harness does not answer the
# pause, so the run makes 8; the ceiling of 9 still holds.
#
# This still catches the failure it exists for — an unenforced bound produces an
# unbounded call count, not 10 — and the companion test
# `the_retry_bound_is_what_stops_the_loop` additionally asserts the count is
# above 1, so a loop that never engaged cannot pass either.
model_calls_at_most = 9
files_changed_outside_patch = 0
# Spec 63: `ls` is an exploration command, so its eight failures record no
# finding. Deterministic only, because a live model may never run one.
exploration_findings = 0
deterministic_only = ["exploration_findings"]
